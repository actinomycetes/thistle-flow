name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - name: Single-file build bundles cleanly
        run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: thistle-flow-single-file, path: dist/thistle-flow.html }

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:e2e
        env:
          TF_BROWSER: ${{ matrix.browser }}
