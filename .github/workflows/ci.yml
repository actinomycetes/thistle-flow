name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - name: Single-file build bundles cleanly
        run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: thistle-flow-single-file, path: dist/thistle-flow.html }
