# Publishes a GitHub pre-release for every version in js/version.js that has no tag yet:
# tag vX.Y.Z on the last commit carrying that version (so later fixes are included) that does not
# change workflow files (the workflow token may not tag those), the single-file build attached,
# notes taken from the version history in help.html. Runs on every push to main (after its
# own unit tests), so a version-bump commit is all a release needs. It can also be started
# by hand: Actions -> Release -> Run workflow.
name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Unit tests
        run: npm test
      - name: Create missing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          # every version that js/version.js has ever had, oldest first
          versions=$(git log --reverse -p -- js/version.js | sed -n "s/^+export const APP_VERSION = '\([0-9.]*\)';/\1/p" | awk '!seen[$0]++')
          for v in $versions; do
            tag="v$v"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then echo "$tag exists"; continue; fi
            first=$(git log --reverse --format=%H -S"APP_VERSION = '$v'" -- js/version.js | head -1)
            sha=""
            for c in $(git rev-list --reverse "$first^..HEAD"); do
              git show "$c:js/version.js" | grep -q "APP_VERSION = '$v'" || continue
              git diff-tree --no-commit-id --name-only -r "$c" | grep -q '^\.github/workflows/' && continue
              sha=$c
            done
            if [ -z "$sha" ]; then echo "::warning::$tag: every commit with this version changes workflow files; skipped"; continue; fi
            echo "Releasing $tag from $sha"
            dir="$RUNNER_TEMP/build-$v"
            git worktree add --detach "$dir" "$sha"
            (cd "$dir" && node tools/build.mjs)
            node tools/release-notes.mjs "$v" help.html > "$RUNNER_TEMP/notes-$v.md"
            gh release create "$tag" "$dir/dist/thistle-flow.html" --target "$sha" --prerelease \
              --title "Thistle Flow $tag (beta)" --notes-file "$RUNNER_TEMP/notes-$v.md"
            git worktree remove --force "$dir"
          done
